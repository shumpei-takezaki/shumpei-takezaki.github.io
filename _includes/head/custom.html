{% include base_path %}

<!-- start custom head snippets -->

<!-- favicon: images/favicon*.png|svg|ico (round portrait). Bump ?v=N below when the icon changes, to bypass the browser cache. -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png?v=2"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg?v=2"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png?v=2" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png?v=2" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json?v=2"/>
<link rel="icon" href="/images/favicon.ico?v=2"/>
<meta name="theme-color" content="#ffffff"/>
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<!-- Support for MatJax -->
<script src="https://cdnjs.cloudflare.com/polyfill/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

<!-- end custom head snippets -->
